# Issue/PR #291, questions 1 and 2 (Entscheidung des Projektinhabers, 2026-11-07): Dependabot instead of Renovate,
# weekly and bundled per ecosystem, no automerge. Every update runs through the same CI as any other PR
# (build-test with .github/scripts/image-pin-check.sh, compose-smoke with `caddy validate`) and is merged by hand.
# Handling: docs/development/betrieb.md §11.6.
#
# Pins (VC-X-09, betrieb.md §11): Dependabot keeps the existing form. An image written as `tag@sha256:…` gets a new
# tag and the new digest, an action written as `owner/action@<sha> # vX.Y.Z` a new SHA and a new version comment.
version: 2

updates:
  # Yarn berry (3.3.0, yarnPath in .yarnrc.yml) at the repository root; the root manifest covers the workspaces
  # services/* and the single yarn.lock.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Berlin
    # The weekly bundle holds minor and patch updates only; every other major comes as its own PR, so a red upgrade
    # never blocks the bundle and its cause shows at once (Entscheidung des Projektinhabers, 2026-11-09, on #303).
    # prettier and typescript-eslint get their own weekly group: their minors reformat code and add lint rules, which
    # would otherwise turn the whole bundle red. Rule for these PRs: reformatting in one commit, new lint findings in a
    # second, no behaviour changed (Entscheidung des Projektinhabers, 2026-11-09). Dependabot puts a dependency into
    # the first group that matches, so lint-format stands before npm.
    groups:
      lint-format:
        patterns: ['prettier', 'typescript-eslint', '@typescript-eslint/*']
        update-types: ['minor', 'patch']
      npm:
        patterns: ['*']
        update-types: ['minor', 'patch']
    ignore:
      # Node major follows engines.node (^24) and .nvmrc, changed on purpose, not by a bump.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # The four majors from #303 are planned work with a backlog row each, not weekly PRs (same decision):
      # TypeScript 7 (VC-X-07), Zod 4 (VC-X-65), Express 5 with @types/express 5 (VC-X-66), Vitest 5 (VC-X-67).
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      - dependency-name: zod
        update-types: ['version-update:semver-major']
      - dependency-name: express
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/express'
        update-types: ['version-update:semver-major']
      - dependency-name: vitest
        update-types: ['version-update:semver-major']
      # ESLint 10 likewise (owner, 2026-11-09, on #306/#307): it needs a typescript-eslint with ESLint 10 support first,
      # then a config check (VC-X-68). @eslint/js moves with eslint.
      - dependency-name: eslint
        update-types: ['version-update:semver-major']
      - dependency-name: '@eslint/js'
        update-types: ['version-update:semver-major']
      # Kysely is 0.x: a minor is a breaking release (VC-X-07: "a 0.x minor upgrade is always a deliberate change");
      # patch releases still come in the bundle (optional nit from the review on #304).
      - dependency-name: kysely
        update-types: ['version-update:semver-minor']

  # Dockerfile base image (node:24-bookworm-slim, both stages).
  - package-ecosystem: docker
    directory: /services/de-backend
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Berlin
    groups:
      docker:
        patterns: ['*']
    ignore:
      - dependency-name: node
        update-types: ['version-update:semver-major']

  # docker-compose.yml (postgres, redis, mongo) and docker-compose.proxy.yml (caddy).
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Berlin
    groups:
      docker-compose:
        patterns: ['*']
    ignore:
      # MRE images: the pinned baseline of ADR-036, changed only by the upgrade procedure of mre-integration.md §55
      # (commit and six digests together in the ${MRE_VERSION:-…} default, betrieb.md §11.4).
      - dependency-name: ghcr.io/microrealestate/microrealestate/*
      # A new Postgres or MongoDB major is a data migration (dump and restore), not a pin update (betrieb.md §11.4).
      - dependency-name: postgres
        update-types: ['version-update:semver-major']
      - dependency-name: mongo
        update-types: ['version-update:semver-major']
      # Redis belongs to the MRE stack (ADR-036 baseline); the tag 7.4-bookworm targets exactly 7.4, so a new major or
      # minor is untested against the pinned MRE version. Patch and digest updates still come (review on #299).
      - dependency-name: redis
        update-types: ['version-update:semver-major', 'version-update:semver-minor']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Berlin
    groups:
      github-actions:
        patterns: ['*']
