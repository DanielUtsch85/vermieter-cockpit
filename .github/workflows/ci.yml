name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16@sha256:f9a7b9ebf6f56201f949db745e47bc423c0f0f8294bafe991cc10bf74b029657
        env:
          POSTGRES_USER: de_test
          POSTGRES_PASSWORD: de_test
          POSTGRES_DB: de_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U de_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DE_TEST_DATABASE_URL: postgres://de_test:de_test@localhost:5432/de_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Images pinned by digest, actions by commit SHA (VC-X-09; betrieb.md §11)
        run: .github/scripts/image-pin-check.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --immutable
      # The root scripts cover every workspace, services/de-backend and webapps/cockpit (the UI in every step:
      # build, typecheck, lint, size:check, format:check and its Vitest suite in `yarn test`).
      - run: yarn build
      - run: yarn typecheck
      - run: yarn lint
      - run: yarn size:check
      - run: yarn format:check
      - run: yarn api:inventory:check
      - run: yarn test

  # VC-0-07: the full local stack (DE + pinned MRE images) starts and is healthy.
  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Proxy override renders and the Caddyfile validates in the Caddy image (issue 281 item 4; betrieb.md §9)
        run: .github/scripts/compose-proxy-check.sh
      - name: Start stack
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: DE backend health
        run: |
          curl -fsS http://localhost:8090/health/live
          curl -fsS http://localhost:8090/health/ready
      - name: DE business API rejects unauthenticated calls
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' -H 'organizationid: x' http://localhost:8090/api/v1/health)
          echo "status=$status"
          test "$status" = 401
      - name: DE migrations applied in the stack (Phase-0 exit)
        run: |
          applied=$(docker compose exec -T de-postgres psql -U de -d de -tAc "SELECT name FROM kysely_migration ORDER BY name")
          echo "$applied"
          # Every migration file in the repository is applied, no more and no fewer: the list never needs updating.
          expected=$(ls services/de-backend/src/infrastructure/postgres/migrations | grep -E '^[0-9]{4}_.*\.ts$' | sed 's/\.ts$//' | sort)
          diff <(echo "$expected") <(echo "$applied" | sort)
      - name: MRE gateway health
        run: curl -fsS http://localhost:8080/health
      - name: DE against real MRE (signup → signin → realm → /api/v1/health → property link → refresh → financial account → transaction → splits → confirm → correct → reverse → bank import → review)
        run: .github/scripts/compose-auth-smoke.sh
      - name: Backup and restore (issue 281 item 1; betrieb.md) — backup.sh, restore-de.sh and mongorestore into side databases, counts compared
        run: .github/scripts/compose-backup-smoke.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --immutable
      - name: MRE contract test (VC-0-09) against the pinned images
        env:
          MRE_CONTRACT_API_URL: http://localhost:8080/api/v2
          REQUIRE_MRE_CONTRACT: '1'
        run: yarn workspace @vermieter-cockpit/de-backend vitest run src/integrations/mre/mre.contract.test.ts
      - name: Build the cockpit-ui image (webapps/cockpit/Dockerfile, the productive UI service of docker-compose.proxy.yml)
        run: docker compose -f docker-compose.yml -f docker-compose.proxy.yml build cockpit-ui
      # Last on purpose: it adds docker-compose.proxy.yml and recreates authenticator, gateway, emailer and de-backend
      # (all four are overridden there) with the proxy settings (https, the cockpit hostname), which the steps above do
      # not expect. At its end it recreates the authenticator once more with MRE_SIGNUP unset (sign-up closed).
      - name: Cockpit gate through Caddy with curl (/cockpit/ start page and deep link from cockpit-ui with no-store, asset, sign-in, refresh cookie HttpOnly; Secure; SameSite=Strict; Domain=<host>, /api/v1/health, sign-up 404 with the productive default at the end; Entscheidungen des Projektinhabers, 2026-11-10 und 2026-11-11)
        run: .github/scripts/compose-cockpit-gate.sh
      # Only the base stack (docker-compose.yml). The cockpit gate prints the logs of caddy, cockpit-ui and the
      # authenticator itself when it fails (trap in .github/scripts/compose-cockpit-gate.sh).
      - name: Logs on failure
        if: failure()
        run: docker compose ps -a && docker compose logs --no-color --tail=200
      - name: Tear down
        if: always()
        # --remove-orphans: also Caddy and cockpit-ui of the gate step, which docker-compose.yml does not name.
        run: docker compose down -v --remove-orphans

  # VC-X-70: the cockpit in Chromium (Playwright) through Caddy against the stack with the real cockpit-ui service; its
  # own job, not a step of compose-smoke (Entscheidungen des Projektinhabers, 2026-11-10 zu #319 Frage 3 (b), und
  # 2026-11-11, V1 Punkt 4). Same stack and settings as the cockpit gate: docker-compose.yml plus
  # docker-compose.proxy.yml, MRE_SIGNUP=true for the synthetic accounts.
  browser-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the images of this checkout (de-backend of docker-compose.yml, cockpit-ui of docker-compose.proxy.yml)
        run: docker compose -f docker-compose.yml -f docker-compose.proxy.yml build de-backend cockpit-ui
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --immutable
      - name: Pinned Playwright version (webapps/cockpit/package.json, exact)
        id: playwright
        working-directory: webapps/cockpit
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      # The browser builds belong to one Playwright version: the key changes with the pin, so a bump downloads anew.
      - name: Cache the Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # --no-install: only the workspace's own Playwright, never a download of another version. On a cache hit only the
      # system packages are installed; the browser is already there.
      - name: Chromium of the pinned Playwright, with its system packages
        working-directory: webapps/cockpit
        run: npx --no-install playwright install --with-deps chromium
      - name: certutil for the run's own certificate store (libnss3-tools)
        run: command -v certutil || { sudo apt-get update && sudo apt-get install -y libnss3-tools; }
      - name: Browser run through Caddy (sign-in, refresh, Realm choice, 403 without a switch, sign-out, deep link, no-store; import → review items → split from the MRE proposal → confirm → rent suggestion → write-back to MRE)
        run: .github/scripts/compose-browser-e2e.sh
      - name: Playwright report and failure screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: webapps/cockpit/e2e-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.proxy.yml ps -a
          docker compose -f docker-compose.yml -f docker-compose.proxy.yml logs --no-color --tail=200
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.proxy.yml down -v --remove-orphans
