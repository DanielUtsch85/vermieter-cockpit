name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: de_test
          POSTGRES_PASSWORD: de_test
          POSTGRES_DB: de_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U de_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DE_TEST_DATABASE_URL: postgres://de_test:de_test@localhost:5432/de_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --immutable
      - run: yarn build
      - run: yarn typecheck
      - run: yarn test
