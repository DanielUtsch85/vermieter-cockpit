name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: de_test
          POSTGRES_PASSWORD: de_test
          POSTGRES_DB: de_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U de_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DE_TEST_DATABASE_URL: postgres://de_test:de_test@localhost:5432/de_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --immutable
      - run: yarn build
      - run: yarn typecheck
      - run: yarn test

  # VC-0-07: the full local stack (DE + pinned MRE images) starts and is healthy.
  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start stack
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: DE backend health
        run: |
          curl -fsS http://localhost:8090/health/live
          curl -fsS http://localhost:8090/health/ready
      - name: DE business API rejects unauthenticated calls
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' -H 'organizationid: x' http://localhost:8090/api/v1/health)
          echo "status=$status"
          test "$status" = 401
      - name: DE migrations applied in the stack (Phase-0 exit)
        run: |
          applied=$(docker compose exec -T de-postgres psql -U de -d de -tAc "SELECT name FROM kysely_migration ORDER BY name")
          echo "$applied"
          echo "$applied" | grep -qx '0001_baseline'
          echo "$applied" | grep -qx '0002_property_reference'
          echo "$applied" | grep -qx '0003_property_reference_refresh'
          echo "$applied" | grep -qx '0004_financial_account'
      - name: MRE gateway health
        run: curl -fsS http://localhost:8080/health
      - name: DE against real MRE (signup → signin → realm → /api/v1/health → property link → refresh → financial account)
        run: .github/scripts/compose-auth-smoke.sh
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --immutable
      - name: MRE contract test (VC-0-09) against the pinned images
        env:
          MRE_CONTRACT_API_URL: http://localhost:8080/api/v2
          REQUIRE_MRE_CONTRACT: '1'
        run: yarn workspace @vermieter-cockpit/de-backend vitest run src/integrations/mre/mre.contract.test.ts
      - name: Logs on failure
        if: failure()
        run: docker compose ps -a && docker compose logs --no-color --tail=200
      - name: Tear down
        if: always()
        run: docker compose down -v
