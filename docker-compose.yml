# Local development stack (VC-0-07): MRE (MongoDB) + DE (PostgreSQL) side by side.
#
#   docker compose up -d --build --wait
#
# - DE backend:  http://localhost:8090/health/live, /health/ready
# - MRE gateway: http://localhost:8080 (landlord API under /api/v2)
#
# MRE runs from the published images of the pinned baseline commit (ADR-036,
# mre-integration.md §55); pdfgenerator, api and tenantapi are those images with backported fixes on top
# (deploy/mre-*, issues #396 and #398). Of the two MRE frontends only the landlord UI runs (landlord-frontend, behind the gateway
# under /landlord; backlog VC-X-80); the tenant frontend is not started.
# Every image is pinned by digest (VC-X-09): `tag@sha256:…`; for MRE the digest sits in the default of
# ${MRE_VERSION:-…}, so a set MRE_VERSION is tag-only (docs/development/betrieb.md §11); the base digests of the three
# overlays sit in deploy/mre-*/Dockerfile (§11.7, §11.8).
# All secrets below are development defaults — override them via .env, never use
# them in production. Published ports bind to 127.0.0.1 only: with the known
# default ACCESS_TOKEN_SECRET anyone who can reach the gateway could forge MRE
# tokens.

x-node-healthcheck: &node-healthcheck
  interval: 5s
  timeout: 3s
  retries: 30
  start_period: 10s

services:
  #############################################################################
  # DE (Vermieter Cockpit)
  #############################################################################
  de-postgres:
    restart: unless-stopped
    image: postgres:16@sha256:3950ad7c3148ca2175ef1b6c36c9efbf78957ae8fbe8b3a5d7c35af50500382f
    environment:
      POSTGRES_USER: ${DE_DB_USER:-de}
      POSTGRES_PASSWORD: ${DE_DB_PASSWORD:-de_dev_password}
      POSTGRES_DB: ${DE_DB_NAME:-de}
    volumes:
      - de-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DE_DB_USER:-de} -d ${DE_DB_NAME:-de}']
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [net]

  de-backend:
    build:
      context: .
      dockerfile: services/de-backend/Dockerfile
    environment:
      PORT: 8090
      DATABASE_URL: postgres://${DE_DB_USER:-de}:${DE_DB_PASSWORD:-de_dev_password}@de-postgres:5432/${DE_DB_NAME:-de}
      MRE_API_URL: http://gateway:8080/api/v2
    restart: unless-stopped
    ports:
      - '127.0.0.1:8090:8090'
    depends_on:
      de-postgres:
        condition: service_healthy
    networks: [net]

  #############################################################################
  # MRE (pinned baseline)
  #############################################################################
  redis:
    restart: unless-stopped
    image: redis:7.4-bookworm@sha256:2e3eb11462c4e3759e6972678dd051d150ff54b1e60714b3c33b701260172a90
    command: ['sh', '-c', 'docker-entrypoint.sh --requirepass ${REDIS_PASSWORD:-redis_password} --loglevel warning']
    networks: [net]

  mongo:
    restart: unless-stopped
    image: mongo:7@sha256:9896df581dfd0718b7abe112f4c37598d0986c54060e4ec1384997e6503c8c71
    command: --quiet --logpath /dev/null
    volumes:
      - mre-mongo-data:/data/db
    networks: [net]

  gateway:
    restart: unless-stopped
    image: ghcr.io/microrealestate/microrealestate/gateway:${MRE_VERSION:-479d0ad703436071b64dfdf4e48321c121d8efb5@sha256:1f482431144203a1df628c219d66d0a03069f7e7091f2c13bff7e7b36a3a640a}
    environment:
      NODE_ENV: production
      LOGGER_LEVEL: info
      PORT: 8080
      # The MRE landlord UI under /landlord (backlog VC-X-80; Entscheidung des Projektinhabers, 2026-11-17). With
      # EXPOSE_FRONTENDS the pinned gateway (services/gateway/src/index.ts) mounts a proxy for the landlord AND the tenant
      # frontend, throws at start without TENANT_BASE_PATH and checks both in its /health. The tenant frontend is not part
      # of this stack: its two settings name the landlord frontend under its own path, so the second mount is the same
      # /landlord proxy again (never reached, the first one answers), /health checks the landlord UI twice, and /tenant
      # stays a 404 of the gateway.
      EXPOSE_FRONTENDS: 'true'
      LANDLORD_FRONTEND_URL: http://landlord-frontend:8180
      LANDLORD_BASE_PATH: /landlord
      TENANT_FRONTEND_URL: http://landlord-frontend:8180
      TENANT_BASE_PATH: /landlord
      AUTHENTICATOR_URL: http://authenticator:8000
      API_URL: http://api:8200/api/v2
      PDFGENERATOR_URL: http://pdfgenerator:8300/pdfgenerator
      EMAILER_URL: http://emailer:8400/emailer
      TENANTAPI_URL: http://tenantapi:8250/tenantapi
      APP_DOMAIN: localhost:8080
      CORS_ENABLED: 'true'
    ports:
      - '127.0.0.1:8080:8080'
    healthcheck:
      <<: *node-healthcheck
      # MRE images are distroless (no shell, node at /nodejs/bin/node).
      test: ['CMD', '/nodejs/bin/node', '-e', "fetch('http://127.0.0.1:8080/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
    depends_on:
      authenticator:
        condition: service_started
      api:
        condition: service_started
      tenantapi:
        condition: service_started
      pdfgenerator:
        condition: service_started
      emailer:
        condition: service_started
      # The gateway's /health (and so its healthcheck) asks the landlord UI's /landlord/health.
      landlord-frontend:
        condition: service_healthy
    networks: [net]

  # MRE landlord UI (Next.js, webapps/landlord of the pinned commit), reached only through the gateway under /landlord
  # (LANDLORD_BASE_PATH above); no published port. Settings as in MRE's own docker-compose.yml at 479d0ad: BASE_PATH is
  # written into the build at start (runner.js), GATEWAY_URL is the origin the browser calls /api/v2 on (the same origin
  # as the page), DOCKER_GATEWAY_URL the one the server side uses inside the compose network. SIGNUP only shows or hides
  # the sign-up page; whether sign-up works is the authenticator's SIGNUP.
  landlord-frontend:
    image: ghcr.io/microrealestate/microrealestate/landlord-frontend:${MRE_VERSION:-479d0ad703436071b64dfdf4e48321c121d8efb5@sha256:660a8cebb4bdb0fdfd1a399a782ecae0f4794ffdbb56bf938029bde2d28e4f80}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 8180
      BASE_PATH: /landlord
      APP_NAME: MicroRealEstate
      DEMO_MODE: 'false'
      CORS_ENABLED: 'true'
      GATEWAY_URL: http://localhost:8080
      DOCKER_GATEWAY_URL: http://gateway:8080
      SIGNUP: 'true'
    healthcheck:
      <<: *node-healthcheck
      # Next.js's standalone server listens on the address of HOSTNAME, which Docker sets to the container's name, not
      # on 127.0.0.1; /landlord/health is a page of the pinned app that answers 200.
      test: ['CMD', '/nodejs/bin/node', '-e', "fetch('http://' + require('os').hostname() + ':8180/landlord/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
    networks: [net]

  authenticator:
    restart: unless-stopped
    image: ghcr.io/microrealestate/microrealestate/authenticator:${MRE_VERSION:-479d0ad703436071b64dfdf4e48321c121d8efb5@sha256:2147a7eecd884c7e254033dc736b32daed133737b414ec9db33e565dd7430096}
    environment:
      NODE_ENV: production
      PORT: 8000
      LOGGER_LEVEL: info
      REDIS_URL: redis://redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_password}
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:-access_token_secret}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:-refresh_token_secret}
      RESET_TOKEN_SECRET: ${RESET_TOKEN_SECRET:-reset_token_secret}
      APPCREDZ_TOKEN_SECRET: ${APPCREDZ_TOKEN_SECRET:-appcredz_token_secret}
      MONGO_URL: mongodb://mongo/mredb
      EMAILER_URL: http://emailer:8400/emailer
      SIGNUP: 'true'
      APP_DOMAIN: localhost
      APP_PROTOCOL: http
    depends_on: [redis, mongo, emailer]
    networks: [net]

  # The pinned MRE api with the Realm-ownership fix of issue #398 (deploy/mre-api: FROM the pinned image, commit 479d0ad,
  # digest sha256:e764969e…, plus one patched file): the Realm of a record comes from the authorized request, never from
  # the body. Follows no MRE_VERSION, like the pdfgenerator below. Rollback point and upgrade path: betrieb.md §11.8.
  api:
    restart: unless-stopped
    build:
      context: deploy/mre-api
    environment:
      NODE_ENV: production
      PORT: 8200
      LOGGER_LEVEL: info
      MONGO_URL: mongodb://mongo/mredb
      EMAILER_URL: http://emailer:8400/emailer
      PDFGENERATOR_URL: http://pdfgenerator:8300/pdfgenerator
      RESTORE_DB: 'false'
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:-access_token_secret}
      CIPHER_KEY: ${CIPHER_KEY:-cipher_key}
      CIPHER_IV_KEY: ${CIPHER_IV_KEY:-cipher_iv_key}
    depends_on: [mongo, emailer, pdfgenerator]
    networks: [net]

  # The pinned MRE tenantapi with the exact e-mail match of issue #398 (deploy/mre-tenantapi: FROM the pinned image,
  # commit 479d0ad, digest sha256:cb41ee6f…, plus one patched file). Nothing in this stack calls it, and Caddy answers 404
  # for /tenantapi (deploy/caddy/Caddyfile); fixed all the same. Follows no MRE_VERSION. betrieb.md §11.8.
  tenantapi:
    restart: unless-stopped
    build:
      context: deploy/mre-tenantapi
    environment:
      NODE_ENV: production
      PORT: 8250
      LOGGER_LEVEL: info
      MONGO_URL: mongodb://mongo/mredb
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:-access_token_secret}
    depends_on: [mongo]
    networks: [net]

  # The pinned MRE pdfgenerator with the realm fix of issue #396 backported (backlog VC-X-82; Entscheidung des
  # Projektinhabers, 2026-11-17: „Overlay-Backport … Gebaut im Compose wie de-backend, ohne fremde Registry.“):
  # deploy/mre-pdfgenerator/Dockerfile starts FROM the pinned image (commit 479d0ad, digest sha256:05e614a8…) and replaces
  # only the two patched files. It follows no MRE_VERSION: the patch fits only that commit. Rollback point and upgrade
  # path (VC-X-06): docs/development/betrieb.md §11.7.
  pdfgenerator:
    restart: unless-stopped
    build:
      context: deploy/mre-pdfgenerator
    environment:
      NODE_ENV: production
      PORT: 8300
      LOGGER_LEVEL: info
      MONGO_URL: mongodb://mongo/mredb
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:-access_token_secret}
      CIPHER_KEY: ${CIPHER_KEY:-cipher_key}
      CIPHER_IV_KEY: ${CIPHER_IV_KEY:-cipher_iv_key}
      UPLOAD_MAX_SIZE: 2000000000
    # Uploaded documents and generated PDFs (WORKDIR /usr/app of the pinned image); without volumes they live on the
    # container's own layer and are lost when it is recreated. Backed up by scripts/ops/backup.sh (betrieb.md §1).
    volumes:
      - mre-pdf-uploads:/usr/app/services/pdfgenerator/uploads
      - mre-pdf-data:/usr/app/services/pdfgenerator/pdf_documents
    depends_on: [mongo]
    networks: [net]

  emailer:
    restart: unless-stopped
    image: ghcr.io/microrealestate/microrealestate/emailer:${MRE_VERSION:-479d0ad703436071b64dfdf4e48321c121d8efb5@sha256:00df04b1171b44226e2ea03c0fe373e4a819fc09a5859a40edcf274d6a930a63}
    environment:
      NODE_ENV: production
      ALLOW_SENDING_EMAILS: 'false'
      PORT: 8400
      LOGGER_LEVEL: info
      LANDLORD_APP_URL: http://localhost:8080/landlord
      TENANT_APP_URL: http://localhost:8080/tenant
      MONGO_URL: mongodb://mongo/mredb
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:-access_token_secret}
      CIPHER_KEY: ${CIPHER_KEY:-cipher_key}
      CIPHER_IV_KEY: ${CIPHER_IV_KEY:-cipher_iv_key}
      PDFGENERATOR_URL: http://pdfgenerator:8300/pdfgenerator
    depends_on: [mongo, pdfgenerator]
    networks: [net]

volumes:
  de-postgres-data:
  mre-mongo-data:
  mre-pdf-uploads:
  mre-pdf-data:

networks:
  net:
