# Local development stack (VC-0-07): MRE (MongoDB) + DE (PostgreSQL) side by side.
#
#   docker compose up -d --build --wait
#
# - DE backend:  http://localhost:8090/health/live, /health/ready
# - MRE gateway: http://localhost:8080 (landlord API under /api/v2)
#
# MRE runs from the published images of the pinned baseline commit (ADR-036,
# mre-integration.md §55). The frontends are not started; DE only needs the APIs.
# Every image is pinned by digest (VC-X-09): `tag@sha256:…`; for MRE the digest sits in the default of
# ${MRE_VERSION:-…}, so a set MRE_VERSION is tag-only (docs/development/betrieb.md §11).
# All secrets below are development defaults — override them via .env, never use
# them in production. Published ports bind to 127.0.0.1 only: with the known
# default ACCESS_TOKEN_SECRET anyone who can reach the gateway could forge MRE
# tokens.

x-node-healthcheck: &node-healthcheck
  interval: 5s
  timeout: 3s
  retries: 30
  start_period: 10s

services:
  #############################################################################
  # DE (Vermieter Cockpit)
  #############################################################################
  de-postgres:
    image: postgres:16@sha256:f9a7b9ebf6f56201f949db745e47bc423c0f0f8294bafe991cc10bf74b029657
    environment:
      POSTGRES_USER: ${DE_DB_USER:-de}
      POSTGRES_PASSWORD: ${DE_DB_PASSWORD:-de_dev_password}
      POSTGRES_DB: ${DE_DB_NAME:-de}
    volumes:
      - de-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DE_DB_USER:-de} -d ${DE_DB_NAME:-de}']
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [net]

  de-backend:
    build:
      context: .
      dockerfile: services/de-backend/Dockerfile
    environment:
      PORT: 8090
      DATABASE_URL: postgres://${DE_DB_USER:-de}:${DE_DB_PASSWORD:-de_dev_password}@de-postgres:5432/${DE_DB_NAME:-de}
      MRE_API_URL: http://gateway:8080/api/v2
    restart: unless-stopped
    ports:
      - '127.0.0.1:8090:8090'
    depends_on:
      de-postgres:
        condition: service_healthy
    networks: [net]

  #############################################################################
  # MRE (pinned baseline)
  #############################################################################
  redis:
    image: redis:7.4-bookworm@sha256:2e3eb11462c4e3759e6972678dd051d150ff54b1e60714b3c33b701260172a90
    command: ['sh', '-c', 'docker-entrypoint.sh --requirepass ${REDIS_PASSWORD:-redis_password} --loglevel warning']
    networks: [net]

  mongo:
    image: mongo:7@sha256:8bb4442761a63a8dda452744082cdac9644b429807eb977b42324a63cef59ca4
    command: --quiet --logpath /dev/null
    volumes:
      - mre-mongo-data:/data/db
    networks: [net]

  gateway:
    image: ghcr.io/microrealestate/microrealestate/gateway:${MRE_VERSION:-479d0ad703436071b64dfdf4e48321c121d8efb5@sha256:1f482431144203a1df628c219d66d0a03069f7e7091f2c13bff7e7b36a3a640a}
    environment:
      NODE_ENV: production
      LOGGER_LEVEL: info
      PORT: 8080
      EXPOSE_FRONTENDS: 'false'
      AUTHENTICATOR_URL: http://authenticator:8000
      API_URL: http://api:8200/api/v2
      PDFGENERATOR_URL: http://pdfgenerator:8300/pdfgenerator
      EMAILER_URL: http://emailer:8400/emailer
      TENANTAPI_URL: http://tenantapi:8250/tenantapi
      APP_DOMAIN: localhost:8080
      CORS_ENABLED: 'true'
    ports:
      - '127.0.0.1:8080:8080'
    healthcheck:
      <<: *node-healthcheck
      # MRE images are distroless (no shell, node at /nodejs/bin/node).
      test: ['CMD', '/nodejs/bin/node', '-e', "fetch('http://127.0.0.1:8080/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
    depends_on: [authenticator, api, tenantapi, pdfgenerator, emailer]
    networks: [net]

  authenticator:
    image: ghcr.io/microrealestate/microrealestate/authenticator:${MRE_VERSION:-479d0ad703436071b64dfdf4e48321c121d8efb5@sha256:2147a7eecd884c7e254033dc736b32daed133737b414ec9db33e565dd7430096}
    environment:
      NODE_ENV: production
      PORT: 8000
      LOGGER_LEVEL: info
      REDIS_URL: redis://redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_password}
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:-access_token_secret}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:-refresh_token_secret}
      RESET_TOKEN_SECRET: ${RESET_TOKEN_SECRET:-reset_token_secret}
      APPCREDZ_TOKEN_SECRET: ${APPCREDZ_TOKEN_SECRET:-appcredz_token_secret}
      MONGO_URL: mongodb://mongo/mredb
      EMAILER_URL: http://emailer:8400/emailer
      SIGNUP: 'true'
      APP_DOMAIN: localhost
      APP_PROTOCOL: http
    depends_on: [redis, mongo, emailer]
    networks: [net]

  api:
    image: ghcr.io/microrealestate/microrealestate/api:${MRE_VERSION:-479d0ad703436071b64dfdf4e48321c121d8efb5@sha256:e764969e031f0b5efa2e104bce4b74f4f7e02982be4174cd6fc4e7f2b9083a92}
    environment:
      NODE_ENV: production
      PORT: 8200
      LOGGER_LEVEL: info
      MONGO_URL: mongodb://mongo/mredb
      EMAILER_URL: http://emailer:8400/emailer
      PDFGENERATOR_URL: http://pdfgenerator:8300/pdfgenerator
      RESTORE_DB: 'false'
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:-access_token_secret}
      CIPHER_KEY: ${CIPHER_KEY:-cipher_key}
      CIPHER_IV_KEY: ${CIPHER_IV_KEY:-cipher_iv_key}
    depends_on: [mongo, emailer, pdfgenerator]
    networks: [net]

  tenantapi:
    image: ghcr.io/microrealestate/microrealestate/tenantapi:${MRE_VERSION:-479d0ad703436071b64dfdf4e48321c121d8efb5@sha256:cb41ee6f5ef823a1de726ae19327e8618ea68bd08ea721ba85a31ef740443ec9}
    environment:
      NODE_ENV: production
      PORT: 8250
      LOGGER_LEVEL: info
      MONGO_URL: mongodb://mongo/mredb
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:-access_token_secret}
    depends_on: [mongo]
    networks: [net]

  pdfgenerator:
    image: ghcr.io/microrealestate/microrealestate/pdfgenerator:${MRE_VERSION:-479d0ad703436071b64dfdf4e48321c121d8efb5@sha256:05e614a8b5c534cae360e20df59e93a99a80afb0fb6afef127db388c08ef1c15}
    environment:
      NODE_ENV: production
      PORT: 8300
      LOGGER_LEVEL: info
      MONGO_URL: mongodb://mongo/mredb
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:-access_token_secret}
      CIPHER_KEY: ${CIPHER_KEY:-cipher_key}
      CIPHER_IV_KEY: ${CIPHER_IV_KEY:-cipher_iv_key}
      UPLOAD_MAX_SIZE: 2000000000
    # Uploaded documents and generated PDFs (WORKDIR /usr/app of the pinned image); without volumes they live on the
    # container's own layer and are lost when it is recreated. Backed up by scripts/ops/backup.sh (betrieb.md §1).
    volumes:
      - mre-pdf-uploads:/usr/app/services/pdfgenerator/uploads
      - mre-pdf-data:/usr/app/services/pdfgenerator/pdf_documents
    depends_on: [mongo]
    networks: [net]

  emailer:
    image: ghcr.io/microrealestate/microrealestate/emailer:${MRE_VERSION:-479d0ad703436071b64dfdf4e48321c121d8efb5@sha256:00df04b1171b44226e2ea03c0fe373e4a819fc09a5859a40edcf274d6a930a63}
    environment:
      NODE_ENV: production
      ALLOW_SENDING_EMAILS: 'false'
      PORT: 8400
      LOGGER_LEVEL: info
      LANDLORD_APP_URL: http://localhost:8080/landlord
      TENANT_APP_URL: http://localhost:8080/tenant
      MONGO_URL: mongodb://mongo/mredb
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:-access_token_secret}
      CIPHER_KEY: ${CIPHER_KEY:-cipher_key}
      CIPHER_IV_KEY: ${CIPHER_IV_KEY:-cipher_iv_key}
      PDFGENERATOR_URL: http://pdfgenerator:8300/pdfgenerator
    depends_on: [mongo, pdfgenerator]
    networks: [net]

volumes:
  de-postgres-data:
  mre-mongo-data:
  mre-pdf-uploads:
  mre-pdf-data:

networks:
  net:
